# Workflow
# Should have name
name: Hello 
# on tells when the workflow run (Give indentation by tab)
on: 
  workflow_dispatch: 
# Job tells what the worklfow should do, there can be one or more than one jobs, hence we write jobs
# Should be inside the workflow
# Job tells what the workflow do
jobs: 
    # 1st job (Give Indentation)
  say-hello:
    # Creates an Ephermal container with ephermal running
    runs-on: ubuntu-latest
    # That ephermal container will have steps to execute, hence name those steps and use run: has the command
    steps:
      - name: Say hello to everyone
        run: echo "Hello Dosto"
# Steps
# Should be inside the job

# Actions
# Should br inside the steps
